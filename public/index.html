<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#111b21;color:#fff;height:100vh;display:flex;flex-direction:column}
header{background:#202c33;padding:12px;display:flex;justify-content:space-between;align-items:center}
#list{flex:1;overflow:auto}
.item{display:flex;gap:12px;padding:12px;border-bottom:1px solid #1f2c34}
.item img{width:50px;height:50px;border-radius:50%}
.info{flex:1;overflow:hidden}
.top{display:flex;justify-content:space-between}
.time{font-size:11px;opacity:.5}
.last{font-size:13px;opacity:.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chatView{flex:1;display:none;flex-direction:column;background:#0b141a}
#chat{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
.m{max-width:78%;padding:8px 10px;border-radius:8px;word-break:break-word}
.m img{max-width:200px;border-radius:8px;display:block}
.me{align-self:flex-end;background:#005c4b}
.ot{align-self:flex-start;background:#202c33}
.input{background:#202c33;padding:8px;display:flex;gap:6px}
.input input{flex:1;padding:12px;border-radius:20px;border:none;background:#2a3942;color:#fff;outline:none}
button{border:none;background:#00a884;color:#fff;border-radius:50%;width:42px;height:42px}
#login{position:fixed;inset:0;background:#111b21;display:flex;align-items:center;justify-content:center;z-index:10}
.card{background:#202c33;padding:20px;border-radius:12px;width:90%;max-width:320px;text-align:center}
.card input{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:none;background:#2a3942;color:#fff}
#fab{position:fixed;bottom:20px;right:20px;width:56px;height:56px;border-radius:50%;font-size:28px}
.hidden{display:none!important}
#viewer{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:20}
#viewer img{max-width:95%;max-height:95%}
</style>
</head>
<body>

<div id="login"><div class="card"><h2 style="color:#00a884">Login</h2><input id="n" placeholder="Name"><input id="u" placeholder="username"><button style="width:100%;border-radius:10px;padding:12px;margin-top:8px" onclick="doLogin()">Start Chat</button></div></div>

<div id="newBox" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9;display:flex;align-items:center;justify-content:center"><div class="card"><h3>New Chat</h3><input id="q" placeholder="search username" oninput="doSearch()"><div id="res"></div><button style="width:100%;background:transparent;color:#aaa;margin-top:10px" onclick="closeNew()">Close</button></div></div>

<div id="viewer" onclick="this.style.display='none'"><img id="big"></div>

<header>
<div style="display:flex;align-items:center;gap:8px"><button id="back" class="hidden" style="background:transparent;width:auto" onclick="showList()">←</button><img id="dp" style="width:38px;height:38px;border-radius:50%"><div><b id="nm"></b><div id="un" style="font-size:11px;opacity:.6"></div></div></div>
<div><button style="background:transparent" onclick="doLogout()">Logout</button></div>
</header>

<div id="list"></div>
<div id="chatView"><div id="chat"></div><div class="input"><button onclick="document.getElementById('f').click()">📎</button><input type="file" id="f" accept="image/*" style="display:none"><input id="msg" placeholder="Message"><button onclick="sendMsg()">➤</button></div></div>
<button id="fab" onclick="openNew()">+</button>

<script src="/socket.io/socket.io.js"></script>
<script>
let socket=io();
let myId=localStorage.getItem('wa_id');
let myName=localStorage.getItem('wa_name');
let myUname=localStorage.getItem('wa_uname');
let myDP=localStorage.getItem('wa_dp');
let sel=JSON.parse(localStorage.getItem('wa_sel')||'null');
let chats=JSON.parse(localStorage.getItem('wa_chats')||'{}');
let users=JSON.parse(localStorage.getItem('wa_users')||'{}');

if(myId){
  document.getElementById('login').classList.add('hidden');
  document.getElementById('nm').innerText=myName;
  document.getElementById('un').innerText='@'+myUname;
  document.getElementById('dp').src=myDP;
  socket.emit('join',{id:myId,name:myName,username:myUname,dp:myDP});
}

function doLogin(){
  let n=document.getElementById('n').value.trim();
  let u=document.getElementById('u').value.trim().toLowerCase().replace(/[^a-z0-9_]/g,'');
  if(!n||!u) return;
  let id='u_'+Date.now();
  let dp='https://i.pravatar.cc/150?u='+id;
  localStorage.setItem('wa_id',id);
  localStorage.setItem('wa_name',n);
  localStorage.setItem('wa_uname',u);
  localStorage.setItem('wa_dp',dp);
  location.reload();
}
function doLogout(){ localStorage.clear(); location.reload(); }

function openNew(){ document.getElementById('newBox').classList.remove('hidden'); document.getElementById('newBox').style.display='flex'; }
function closeNew(){ document.getElementById('newBox').classList.add('hidden'); }

function doSearch(){ let q=document.getElementById('q').value.trim(); if(q) socket.emit('searchUser', q); }

socket.on('users', list=>{
  list.forEach(u=>{ users[u.id]=u; });
  localStorage.setItem('wa_users', JSON.stringify(users));
  renderList();
});
socket.on('searchResult', list=>{
  let box=document.getElementById('res'); box.innerHTML='';
  list.forEach(u=>{
    if(u.id===myId) return;
    users[u.id]=u;
    let d=document.createElement('div'); d.className='item';
    d.innerHTML=`<img src="${u.dp}"><div class="info"><b>${u.name}</b><div class="last">@${u.username}</div></div>`;
    d.onclick=()=>{ openChat(u); closeNew(); };
    box.appendChild(d);
  });
  localStorage.setItem('wa_users', JSON.stringify(users));
});

function renderList(){
  let el=document.getElementById('list'); el.innerHTML='';
  let obj={};
  Object.keys(chats).forEach(id=>{
    if(!chats[id]||!chats[id].length) return;
    if(id===myId) return;
    let u=users[id]||{id:id,name:id,username:id,dp:'https://i.pravatar.cc/100?u='+id};
    let last=chats[id][chats[id].length-1];
    obj[id]={user:u,time:last.time,text:last.file?'📎 Photo':last.text};
  });
  Object.values(users).forEach(u=>{
    if(u.id===myId) return;
    if(!obj[u.id]) obj[u.id]={user:u,time:0,text:'Tap to chat'};
  });
  let arr=Object.values(obj).sort((a,b)=>b.time-a.time);
  if(!arr.length){ el.innerHTML='<p style="text-align:center;margin-top:60px;opacity:.4">No chats<br>Tap + to start</p>'; return; }
  arr.forEach(o=>{
    let u=o.user; let tm=o.time? new Date(o.time).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'';
    let d=document.createElement('div'); d.className='item';
    d.innerHTML=`<img src="${u.dp}"><div class="info"><div class="top"><b>${u.name}</b><span class="time">${tm}</span></div><div class="last">${o.text}</div></div>`;
    d.onclick=()=>openChat(u);
    el.appendChild(d);
  });
}

function showList(){
  document.getElementById('chatView').style.display='none';
  document.getElementById('list').style.display='block';
  document.getElementById('fab').style.display='block';
  document.getElementById('back').classList.add('hidden');
  renderList();
}
function openChat(u){
  sel=u; localStorage.setItem('wa_sel', JSON.stringify(u));
  users[u.id]=u; localStorage.setItem('wa_users', JSON.stringify(users));
  document.getElementById('nm').innerText=u.name;
  document.getElementById('un').innerText='@'+u.username;
  document.getElementById('dp').src=u.dp;
  document.getElementById('list').style.display='none';
  document.getElementById('chatView').style.display='flex';
  document.getElementById('fab').style.display='none';
  document.getElementById('back').classList.remove('hidden');
  let c=document.getElementById('chat'); c.innerHTML='';
  (chats[u.id]||[]).forEach(m=>addBubble(m,m.from===myId?'me':'ot',false));
}

function addBubble(d,type,save){
  let c=document.getElementById('chat');
  let div=document.createElement('div'); div.className='m '+type;
  let h=''; if(d.file) h+=`<img src="${d.file}" onclick="document.getElementById('big').src=this.src; document.getElementById('viewer').style.display='flex'">`;
  h+=`${d.text||''}<div style="font-size:10px;opacity:.5;text-align:right">${new Date(d.time).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</div>`;
  div.innerHTML=h;
  c.appendChild(div); c.scrollTop=c.scrollHeight;
  if(save){ if(!chats[sel.id]) chats[sel.id]=[]; chats[sel.id].push(d); localStorage.setItem('wa_chats', JSON.stringify(chats)); }
}

function sendMsg(){
  let t=document.getElementById('msg').value.trim(); if(!t||!sel) return;
  let data={msgId:'m_'+Date.now(), text:t, from:myId, to:sel.id, time:Date.now()};
  addBubble(data,'me',true); socket.emit('send', data); document.getElementById('msg').value=''; renderList();
}
document.getElementById('msg').addEventListener('keypress', e=>{ if(e.key==='Enter') sendMsg(); });
document.getElementById('f').addEventListener('change', e=>{
  let file=e.target.files[0]; if(!file||!sel) return;
  let r=new FileReader(); r.onload=()=>{ let data={msgId:'m_'+Date.now(), text:file.name, file:r.result, from:myId, to:sel.id, time:Date.now()}; addBubble(data,'me',true); socket.emit('send', data); renderList(); }; r.readAsDataURL(file); e.target.value='';
});
socket.on('receive', data=>{
  if(!chats[data.from]) chats[data.from]=[];
  chats[data.from].push(data); localStorage.setItem('wa_chats', JSON.stringify(chats));
  if(sel && sel.id===data.from) addBubble(data,'ot',false); else renderList();
});
renderList();
</script>
</body>
</html>
