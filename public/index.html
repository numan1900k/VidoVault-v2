<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OffGridChat - WhatsApp Pro</title>
<script src="/socket.io/socket.io.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#111b21;color:#fff;display:flex;height:100vh}
#sidebar{width:30%;min-width:260px;background:#111b21;border-right:1px solid #222d34;display:flex;flex-direction:column}
#main{flex:1;display:flex;flex-direction:column;background:#0b141a}
.header{padding:15px;background:#202c33;display:flex;justify-content:space-between;align-items:center}
.user-list{flex:1;overflow-y:auto}
.user-item{padding:12px 15px;border-bottom:1px solid #222d34;cursor:pointer;display:flex;justify-content:space-between}
.user-item:hover,.user-item.active{background:#2a3942}
#chat{flex:1;overflow-y:auto;padding:20px;background:#0b141a}
.msg{max-width:65%;padding:8px 10px;border-radius:8px;margin:5px 0;word-break:break-word}
.msg.me{background:#005c4b;margin-left:auto}
.msg.other{background:#202c33}
.msg.private{border-left:3px solid #ff9800}
#inputArea{padding:10px;background:#202c33;display:flex;gap:8px;align-items:center}
input,button{border:none;outline:none;border-radius:20px}
input{flex:1;padding:12px 15px;background:#2a3942;color:#fff}
button{padding:10px 14px;background:#00a884;color:#fff;cursor:pointer;font-weight:bold}
#login{position:fixed;inset:0;background:#111b21;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99}
#login input{width:250px;margin:10px}
.call-box{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#202c33;padding:20px;border-radius:12px;z-index:100;display:none;text-align:center}
</style>
</head>
<body>
<div id="login">
<h2>OffGridChat WhatsApp Pro</h2>
<input id="nameInput" placeholder="Apna naam likho">
<button onclick="joinChat()">Start Chat</button>
</div>
<div id="sidebar">
<div class="header"><b>Chats</b><span id="myName"></span></div>
<div id="userList" class="user-list"></div>
<div style="padding:10px;font-size:12px;color:#8696a0">Tap user = Private | File | Call</div>
</div>
<div id="main">
<div class="header"><span id="chatWith">Everyone (Group)</span>
<div><button onclick="startCall()">📞 Call</button> <button onclick="document.getElementById('fileInput').click()">📎 File</button></div>
</div>
<div id="chat"></div>
<div id="inputArea">
<input type="file" id="fileInput" hidden onchange="sendFile(this)">
<input id="msgInput" placeholder="Message likho..." onkeypress="if(event.key==='Enter')sendMsg()">
<button onclick="sendMsg()">➤</button>
</div>
</div>
<div id="callBox" class="call-box">
<h3 id="callText">Incoming Call...</h3>
<audio id="remoteAudio" autoplay></audio>
<div style="margin-top:15px"><button id="acceptBtn" onclick="acceptCall()">Accept</button> <button onclick="endCall()" style="background:#f15c6d">Cut</button></div>
</div>
<script>
const socket = io();
let myName='', selectedUser='Everyone', peer;
function joinChat(){
 myName = document.getElementById('nameInput').value.trim();
 if(!myName) return alert('Naam likho');
 document.getElementById('login').style.display='none';
 document.getElementById('myName').innerText=myName;
 socket.emit('join', myName);
}
function addMsg(data, isMe){
 const chat=document.getElementById('chat');
 const div=document.createElement('div');
 div.className='msg '+(isMe?'me':'other')+(data.isPrivate?' private':'');
 div.innerHTML=`<small style="color:#8696a0">${data.from}${data.isPrivate?' → '+data.to:''}</small><br>${data.text||''}${data.file?`<br><a href="${data.file}" target="_blank" download style="color:#53bdeb">📁 Download File</a><br>${data.fileType?.startsWith('image')?`<img src="${data.file}" style="max-width:200px;border-radius:8px;margin-top:5px">`:''}`:''}`;
 chat.appendChild(div); chat.scrollTop=chat.scrollHeight;
}
function sendMsg(){
 const txt=document.getElementById('msgInput').value;
 if(!txt) return;
 const data={from:myName, to:selectedUser, text:txt, isPrivate:selectedUser!=='Everyone'};
 if(data.isPrivate) socket.emit('private_msg', data); else socket.emit('msg', data);
 if(data.isPrivate) addMsg(data,true);
 document.getElementById('msgInput').value='';
}
socket.on('msg', d=> addMsg(d, d.from===myName));
socket.on('private_msg', d=> addMsg(d, d.from===myName));
socket.on('file', d=> addMsg(d, d.from===myName));
socket.on('users', list=>{
 const ul=document.getElementById('userList'); ul.innerHTML='';
 const all=document.createElement('div'); all.className='user-item'+(selectedUser==='Everyone'?' active':'');
 all.innerHTML='<span>🌐 Everyone</span>'; all.onclick=()=>{selectedUser='Everyone'; document.getElementById('chatWith').innerText='Everyone (Group)'; document.querySelectorAll('.user-item').forEach(e=>e.classList.remove('active')); all.classList.add('active');};
 ul.appendChild(all);
 list.forEach(u=>{ if(u===myName) return; const div=document.createElement('div'); div.className='user-item'+(selectedUser===u?' active':''); div.innerHTML=`<span>👤 ${u}</span><span>📩 📞</span>`; div.onclick=()=>{selectedUser=u; document.getElementById('chatWith').innerText=u+' (Private)'; document.querySelectorAll('.user-item').forEach(e=>e.classList.remove('active')); div.classList.add('active');}; ul.appendChild(div);});
});
function sendFile(input){
 const file=input.files[0]; if(!file) return;
 const reader=new FileReader();
 reader.onload=e=>{
   const data={from:myName, to:selectedUser, file:e.target.result, fileType:file.type, fileName:file.name, text:`📁 ${file.name}`, isPrivate:selectedUser!=='Everyone'};
   socket.emit('file', data);
 };
 reader.readAsDataURL(file);
}
async function createPeer(){
 peer=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
 peer.onicecandidate=e=>{ if(e.candidate) socket.emit('ice',{to:selectedUser, candidate:e.candidate}); };
 peer.ontrack=e=>{ document.getElementById('remoteAudio').srcObject=e.streams[0]; };
 const stream=await navigator.mediaDevices.getUserMedia({audio:true});
 stream.getTracks().forEach(t=>peer.addTrack(t,stream));
 return peer;
}
async function startCall(){
 if(selectedUser==='Everyone') return alert('Private chat select karo call ke liye');
 document.getElementById('callBox').style.display='block'; document.getElementById('callText').innerText=`Calling ${selectedUser}...`;
 const p=await createPeer(); const offer=await p.createOffer(); await p.setLocalDescription(offer);
 socket.emit('call_user',{to:selectedUser, offer});
}
socket.on('incoming_call', async ({from, offer})=>{
 selectedUser=from; document.getElementById('chatWith').innerText=from+' (Private)';
 document.getElementById('callBox').style.display='block'; document.getElementById('callText').innerText=`${from} calling...`; window._offer=offer;
});
async function acceptCall(){
 const p=await createPeer(); await p.setRemoteDescription(new RTCSessionDescription(window._offer));
 const ans=await p.createAnswer(); await p.setLocalDescription(ans);
 socket.emit('answer_call',{to:selectedUser, answer:ans}); document.getElementById('callText').innerText=`On call with ${selectedUser}`;
}
socket.on('call_answered', async ({answer})=>{ await peer.setRemoteDescription(new RTCSessionDescription(answer)); document.getElementById('callText').innerText=`On call with ${selectedUser}`; });
socket.on('ice', async ({candidate})=>{ try{ await peer.addIceCandidate(new RTCIceCandidate(candidate)); }catch(e){} });
function endCall(){ if(peer){peer.close(); peer=null;} document.getElementById('callBox').style.display='none'; }
</script>
</body>
</html>
