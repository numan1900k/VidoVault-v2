<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp Pro</title>
<style>
:root{--g:#00a884;--bg:#111b21;--h:#202c33;--b1:#005c4b;--b2:#202c33;--t:#e9edef}
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:var(--bg);color:var(--t);height:100vh;display:flex;flex-direction:column}
header{background:var(--h);padding:10px;display:flex;justify-content:space-between;align-items:center}
#dp{width:40px;height:40px;border-radius:50%;cursor:pointer}
.tabs{display:flex;background:var(--h)}
.tabs button{flex:1;padding:12px;background:transparent;border:none;color:var(--t);border-bottom:3px solid transparent;cursor:pointer}
.tabs button.active{border-color:var(--g);color:var(--g)}
#chat{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
.b{max-width:75%;padding:8px 10px;border-radius:8px}
.me{align-self:flex-end;background:var(--b1);border-top-right-radius:0}
.ot{align-self:flex-start;background:var(--b2);border-top-left-radius:0}
.meta{font-size:10px;opacity:.6;text-align:right}
.input{background:var(--h);padding:8px;display:flex;gap:8px;align-items:center}
.input input{flex:1;padding:10px;border-radius:20px;border:none;outline:none}
.bt{width:40px;height:40px;border-radius:50%;border:none;background:var(--g);color:#fff;font-size:20px;cursor:pointer}
#users{position:absolute;top:110px;left:10px;background:var(--h);padding:10px;border-radius:10px;display:none;z-index:9;min-width:220px;max-height:50vh;overflow:auto}
#statusBar{display:none;gap:10px;padding:10px;overflow-x:auto;background:var(--bg)}
.sItem{text-align:center;min-width:60px;cursor:pointer}
.sItem img{width:50px;height:50px;border-radius:50%;border:3px solid var(--g)}
</style>
</head>
<body>
<header>
<div style="display:flex;gap:10px;align-items:center"><img id="dp" src="https://i.pravatar.cc/100"><b id="nm"></b></div>
<div style="display:flex;gap:6px"><button class="bt" id="uBtn">👥</button><input type="file" id="dpIn" accept="image/*" hidden></div>
</header>
<div class="tabs">
<button id="tChat" class="active" onclick="setTab('chats')">CHATS</button>
<button id="tStat" onclick="setTab('status')">STATUS</button>
<button id="tGrp" onclick="setTab('groups')">GROUPS</button>
</div>
<div id="statusBar"></div>
<div id="users"></div>
<div id="typing" style="height:16px;font-size:12px;color:var(--g);padding:0 10px"></div>
<div id="chat"></div>
<div class="input">
<label for="fIn" style="cursor:pointer">📎</label><input type="file" id="fIn" accept="image/*" hidden>
<input id="msg" placeholder="Message"><button class="bt" id="vBtn">🎤</button><button class="bt" id="sBtn">➤</button>
</div>
<script src="/socket.io/socket.io.js"></script>
<script>
let socket=io(), myId=localStorage.getItem('wa_id')||'u_'+Math.floor(Math.random()*9999), myName=localStorage.getItem('wa_name')||prompt('Naam:')||myId, myDP=localStorage.getItem('wa_dp')||'https://i.pravatar.cc/100?u='+myId;
localStorage.setItem('wa_id',myId);localStorage.setItem('wa_name',myName);document.getElementById('nm').innerText=myName;document.getElementById('dp').src=myDP;
let sel=null, pendImg=null, isRec=false, rec, chunks=[];
let curTab='chats', groups=[];
const chatEl=document.getElementById('chat'), msgI=document.getElementById('msg');
socket.emit('join',{id:myId,name:myName,dp:myDP});
document.getElementById('dp').onclick=()=>document.getElementById('dpIn').click();
document.getElementById('dpIn').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{myDP=r.result;localStorage.setItem('wa_dp',myDP);document.getElementById('dp').src=myDP;socket.emit('updateDP',{id:myId,dp:myDP})};r.readAsDataURL(f)};
function addMsg(d,type){let el=document.createElement('div');el.className='b '+(type==='me'?'me':'ot');let c='';if(d.image)c+=`<img src="${d.image}" style="max-width:100%;border-radius:6px"><br>`;if(d.audio)c+=`<audio controls src="${d.audio}" style="width:180px"></audio><br>`;c+=d.text||'';let tm=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});el.innerHTML=c+`<div class="meta">${tm} ${type==='me'?'✓✓':''}</div>`;chatEl.appendChild(el);chatEl.scrollTop=chatEl.scrollHeight}
function send(){let t=msgI.value.trim();if(!t&&!pendImg)return;let data={msgId:'m_'+Date.now(),text:t,image:pendImg,from:myId,to:sel?.id||'all',groupId:sel?.isGroup?sel.id:null};if(data.groupId){socket.emit('groupMsg',data);addMsg(data,'me')}else{addMsg({...data,text:t||'📷 Photo'},'me');socket.emit('send',data)}msgI.value='';pendImg=null}
document.getElementById('sBtn').onclick=send;msgI.addEventListener('keypress',e=>{if(e.key==='Enter')send();socket.emit('typing',{to:sel?.id||'all',from:myId,name:myName})});
document.getElementById('fIn').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{pendImg=r.result;msgI.value='📷 Photo selected';};r.readAsDataURL(f)};
document.getElementById('vBtn').onclick=async()=>{if(!isRec){try{let st=await navigator.mediaDevices.getUserMedia({audio:true});rec=new MediaRecorder(st);chunks=[];rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=()=>{let bl=new Blob(chunks,{type:'audio/webm'});let r=new FileReader();r.onload=()=>{let d={msgId:'m_'+Date.now(),audio:r.result,from:myId,to:sel?.id||'all'};addMsg(d,'me');socket.emit('send',d)};r.readAsDataURL(bl)};rec.start();isRec=true;document.getElementById('vBtn').innerText='⏹️'}catch{alert('Mic allow karo')}}else{rec.stop();isRec=false;document.getElementById('vBtn').innerText='🎤'}};
document.getElementById('uBtn').onclick=()=>{let d=document.getElementById('users');d.style.display=d.style.display==='none'?'block':'none'};
socket.on('users',us=>{let d=document.getElementById('users');d.innerHTML='<b>Users</b><br><br>';us.forEach(u=>{if(u.id===myId)return;let row=document.createElement('div');row.style.cssText='display:flex;gap:8px;padding:6px;cursor:pointer';row.innerHTML=`<img src="${u.dp}" style="width:32px;height:32px;border-radius:50%"><span>${u.name}</span>`;row.onclick=()=>{sel=u;document.getElementById('users').style.display='none';chatEl.innerHTML='';document.getElementById('nm').innerText='Chat: '+u.name};d.appendChild(row)})});
socket.on('receive',d=>{addMsg(d,'ot')});socket.on('groupMsg',d=>{if(sel&&sel.id===d.groupId)addMsg(d,'ot');else addMsg({text:`[${groups.find(g=>g.id===d.groupId)?.name||'Group'}] ${d.text||'🔊'}`,image:d.image,audio:d.audio},'ot')});
socket.on('typing',d=>{document.getElementById('typing').innerText=d.name+' typing...';setTimeout(()=>document.getElementById('typing').innerText='',2000)});
socket.on('statuses',list=>{let bar=document.getElementById('statusBar');bar.innerHTML='';list.forEach(s=>{let it=document.createElement('div');it.className='sItem';it.innerHTML=`<img src="${s.dp}"><div style="font-size:10px">${s.name}</div>`;it.onclick=()=>{alert(s.name+': '+s.text);if(s.image)window.open(s.image)};bar.appendChild(it)})});
socket.on('groups',list=>{groups=list;});
function setTab(t){curTab=t;document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));document.getElementById(t==='chats'?'tChat':t==='status'?'tStat':'tGrp').classList.add('active');let bar=document.getElementById('statusBar');if(t==='status'){bar.style.display='flex';let txt=prompt('Status text / image URL daal (khali chhod to cancel):');if(txt){let img=txt.startsWith('http')?txt:null;let tx=img? '':txt;socket.emit('postStatus',{id:myId,name:myName,dp:myDP,text:tx||'Photo',image:img})}}else if(t==='groups'){bar.style.display='none';let gname=prompt('Group naam:');if(gname){let m=prompt('Members ke IDs comma se (users list me se ID copy karo):');let mArr=m?m.split(',').map(s=>s.trim()):[];let gid='g_'+Date.now();socket.emit('createGroup',{id:gid,name:gname,members:[...mArr,myId]});alert('Group ban gaya: '+gname)}}else{bar.style.display='none';chatEl.innerHTML='';}}
</script>
</body>
</html>
