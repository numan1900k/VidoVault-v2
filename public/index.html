<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#00a884">
<style>
:root{--wa-green:#00a884;--bg:#111b21;--header:#202c33;--chat-bg:#0b141a;--bubble-me:#005c4b;--bubble-other:#202c33;--text:#e9edef}
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,Helvetica,Arial,sans-serif}
body{background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100vh;overflow:hidden}
body.light{--bg:#fff;--header:#f0f2f5;--chat-bg:#efeae2;--bubble-me:#d9fdd3;--bubble-other:#fff;--text:#111b21}
header{background:var(--header);padding:10px 16px;display:flex;align-items:center;justify-content:space-between}
.h-left{display:flex;align-items:center;gap:12px}
#myDP{width:40px;height:40px;border-radius:50%;object-fit:cover;cursor:pointer;background:#00a884}
#chatBox{flex:1;background:var(--chat-bg);overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.bubble{max-width:75%;padding:8px 10px;border-radius:8px;word-break:break-word}
.me{align-self:flex-end;background:var(--bubble-me);border-top-right-radius:0}
.other{align-self:flex-start;background:var(--bubble-other);border-top-left-radius:0}
.meta{font-size:10px;opacity:0.6;margin-top:4px;text-align:right}
.tick{font-size:11px;margin-left:6px}
.tick.blue{color:#53bdeb}
.input-area{background:var(--header);padding:8px 10px;display:flex;gap:8px;align-items:center}
.input-area input[type=text]{flex:1;padding:10px 14px;border-radius:20px;border:none;outline:none;background:var(--bubble-other);color:var(--text)}
.btn{width:40px;height:40px;border-radius:50%;border:none;background:var(--wa-green);color:white;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:20px}
#users{position:absolute;top:60px;left:10px;background:var(--header);border-radius:10px;padding:10px;z-index:10;min-width:220px;display:none;max-height:60vh;overflow:auto}
.user-row{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;cursor:pointer}
.typing{font-size:12px;color:var(--wa-green);padding:4px 16px;height:18px}
</style>
</head>
<body>
<header>
<div class="h-left">
<img id="myDP" src="https://i.pravatar.cc/100">
<div><div id="myName" style="font-weight:600"></div><div id="onlineStatus" style="font-size:12px;opacity:0.7">online</div></div>
</div>
<div style="display:flex;gap:8px">
<button class="btn" id="darkBtn" style="background:var(--header)">🌙</button>
<button class="btn" id="usersBtn" style="background:var(--header)">👥</button>
<input type="file" id="dpInput" accept="image/*" hidden>
</div>
</header>
<div id="users"></div>
<div class="typing" id="typing"></div>
<div id="chatBox"></div>
<div class="input-area">
<label class="btn" style="background:var(--header)" for="fileInput">📎</label>
<input type="file" id="fileInput" accept="image/*,video/*" hidden>
<input type="text" id="msgInput" placeholder="Message">
<button class="btn" id="voiceBtn">🎤</button>
<button class="btn" id="sendBtn">➤</button>
</div>
<script src="/socket.io/socket.io.js"></script>
<script>
//... full logic for DP, Tick, Dark mode, Voice, Photo, Typing
const socket=io();
let myId=localStorage.getItem('wa_id')||'user_'+Math.floor(Math.random()*9999);
localStorage.setItem('wa_id',myId);
let myName=localStorage.getItem('wa_name')||prompt('Apna naam:')||myId;
localStorage.setItem('wa_name',myName);
document.getElementById('myName').innerText=myName;
let myDP=localStorage.getItem('wa_dp')||'https://i.pravatar.cc/100?u='+myId;
document.getElementById('myDP').src=myDP;
let selectedUser=null, isRecording=false, mediaRecorder, audioChunks=[];
const chatBox=document.getElementById('chatBox'), msgInput=document.getElementById('msgInput'), typingEl=document.getElementById('typing');
let dark=localStorage.getItem('dark')!=='false';
function applyDark(){document.body.classList.toggle('light',!dark); document.getElementById('darkBtn').innerText=dark?'🌙':'☀️';}
applyDark();
document.getElementById('darkBtn').onclick=()=>{dark=!dark; localStorage.setItem('dark',dark); applyDark();};
document.getElementById('myDP').onclick=()=>document.getElementById('dpInput').click();
document.getElementById('dpInput').onchange=e=>{
  const file=e.target.files[0]; if(!file) return;
  const r=new FileReader(); r.onload=()=>{myDP=r.result; localStorage.setItem('wa_dp',myDP); document.getElementById('myDP').src=myDP; socket.emit('updateDP',{id:myId,dp:myDP,name:myName});}; r.readAsDataURL(file);
};
socket.emit('join',{id:myId,name:myName,dp:myDP});
socket.on('users',users=>{
  const div=document.getElementById('users'); div.innerHTML='<b>Online Users</b><br><br>';
  users.forEach(u=>{ if(u.id===myId) return;
    const row=document.createElement('div'); row.className='user-row';
    row.innerHTML=`<img src="${u.dp}" style="width:36px;height:36px;border-radius:50%"><div style="flex:1"><div>${u.name}</div><div style="font-size:11px;opacity:0.6">${u.online?'online':'offline'}</div></div>`;
    row.onclick=()=>{selectedUser=u; div.style.display='none'; document.getElementById('onlineStatus').innerText='chatting with '+u.name;};
    div.appendChild(row);
  });
});
socket.on('receive',data=>{
  const div=document.createElement('div'); div.className='bubble other'; div.id=data.msgId;
  let c=''; if(data.image) c+=`<img src="${data.image}" style="max-width:100%;border-radius:8px"><br>`;
  if(data.audio) c+=`<audio controls src="${data.audio}" style="max-width:200px"></audio><br>`;
  c+=`<span>${data.text||''}</span>`;
  const time=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  div.innerHTML=c+`<div class="meta">${time}</div>`;
  chatBox.appendChild(div); chatBox.scrollTop=chatBox.scrollHeight;
  socket.emit('delivered',{msgId:data.msgId,from:data.from}); socket.emit('seen',{msgId:data.msgId,from:data.from});
});
socket.on('delivered',({msgId})=>{ const el=document.getElementById(msgId); if(el) el.querySelector('.tick').innerText='✓✓'; });
socket.on('seen',({msgId})=>{ const el=document.getElementById(msgId); if(el) el.querySelector('.tick').innerHTML='<span class="blue">✓✓</span>'; });
socket.on('typing',({from,name})=>{ if(selectedUser && selectedUser.id===from){ typingEl.innerText=name+' typing...'; setTimeout(()=>typingEl.innerText='',2000);} });
function send(){
  const text=msgInput.value.trim(); if(!text &&!window.pendingImage) return;
  const msgId='m_'+Date.now(); const data={msgId,text,from:myId,to:selectedUser?.id||'all',fromName:myName,image:window.pendingImage||null,audio:null,status:'✓'};
  const div=document.createElement('div'); div.className='bubble me'; div.id=msgId;
  let c=''; if(data.image) c+=`<img src="${data.image}" style="max-width:100%;border-radius:8px"><br>`;
  c+=`<span>${data.text}</span>`; const time=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  div.innerHTML=c+`<div class="meta">${time} <span class="tick">✓</span></div>`;
  chatBox.appendChild(div); chatBox.scrollTop=chatBox.scrollHeight;
  socket.emit('send',data); msgInput.value=''; window.pendingImage=null;
}
document.getElementById('sendBtn').onclick=send;
msgInput.addEventListener('keypress',e=>{ if(e.key==='Enter') send(); socket.emit('typing',{to:selectedUser?.id,from:myId,name:myName}); });
document.getElementById('fileInput').onchange=e=>{
  const file=e.target.files[0]; if(!file) return;
  const r=new FileReader(); r.onload=()=>{window.pendingImage=r.result; msgInput.value='📷 Photo'; msgInput.focus();}; r.readAsDataURL(file);
};
document.getElementById('voiceBtn').onclick=async()=>{
  if(!isRecording){
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      mediaRecorder=new MediaRecorder(stream); audioChunks=[];
      mediaRecorder.ondataavailable=e=>audioChunks.push(e.data);
      mediaRecorder.onstop=()=>{
        const blob=new Blob(audioChunks,{type:'audio/webm'});
        const r=new FileReader(); r.onload=()=>{
          const msgId='m_'+Date.now(); const data={msgId,text:'',audio:r.result,from:myId,to:selectedUser?.id||'all',fromName:myName,status:'✓'};
          const div=document.createElement('div'); div.className='bubble me'; div.id=msgId;
          div.innerHTML=`<audio controls src="${data.audio}" style="max-width:200px"></audio><div class="meta">${new Date().toLocaleTimeString()} <span class="tick">✓</span></div>`;
          chatBox.appendChild(div); chatBox.scrollTop=chatBox.scrollHeight; socket.emit('send',data);
        }; r.readAsDataURL(blob);
      };
      mediaRecorder.start(); isRecording=true;
      document.getElementById('voiceBtn').innerText='⏹️'; document.getElementById('voiceBtn').style.background='red';
    }catch{ alert('Mic permission do'); }
  }else{ mediaRecorder.stop(); isRecording=false; document.getElementById('voiceBtn').innerText='🎤'; document.getElementById('voiceBtn').style.background='#00a884'; }
};
document.getElementById('usersBtn').onclick=()=>{
  const d=document.getElementById('users'); d.style.display=d.style.display==='none'?'block':'none';
};
if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js');}
</script>
</body>
</html>
